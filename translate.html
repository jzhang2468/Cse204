<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="./translate.css" rel="stylesheet" />
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header>
            <h1>Voice <span class="grad">Translator</span></h1>
        </header>

        <!-- No SR warning -->
        <div class="nosr" id="nosr" style="display:none">
            <h2>Speech Recognition Not Supported</h2>
            <p>Please open this page in Chrome or Edge to use the microphone.</p>
        </div>

        <div id="main">

            <!-- Control Panel -->
            <div class="ctrl-panel">
                <div class="mic-zone">
                    <button class="mic" id="mic" aria-label="Start recording">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none" />
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1" />
                            <line x1="12" y1="19" x2="12" y2="23" />
                            <line x1="8" y1="23" x2="16" y2="23" />
                        </svg>
                    </button>
                    <div class="mic-status">
                        <span class="s-dot"></span>
                        <span class="s-txt" id="statusTxt">Click to record</span>
                    </div>
                </div>

                <!-- Waveform -->
                <div class="vis-well">
                    <canvas id="cv"></canvas>
                </div>

                <!-- Timer -->
                <div class="timer-zone">
                    <div id="timer">00:00</div>
                    <div class="timer-label">Duration</div>
                </div>
            </div>

            <!-- Transcript -->
            <div class="transcript">
                <div class="transcript-label">Recognized Speech</div>
                <div id="src"><span class="ph">Start speaking to see transcription…</span></div>
            </div>

            <!-- Translation status -->
            <div id="transSt"></div>

            <!-- Language cards -->
            <div class="grid" id="grid"></div>

            <!-- Tech tags -->
            <div class="tags">
                <span>SpeechRecognition</span>
                <span>SpeechSynthesis</span>
                <span>Web Audio API</span>
                <span>Canvas</span>
                <span>MyMemory API</span>
            </div>

        </div>
    </div>

    <script src="./translate.js"></script>

</body>

</html>
