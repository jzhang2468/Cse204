<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;0,700;0,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ── Design Tokens ── */
        :root {
            --bg:             #E0E5EC;
            --fg:             #3D4852;
            --muted:          #6B7280;
            --accent:         #6C63FF;
            --accent-l:       #8B84FF;
            --teal:           #38B2AC;
            --amber:          #F59E0B;
            --pink:           #EC4899;
            --emerald:        #10B981;
            --orange:         #F97316;
            --red:            #EF4444;

            --sd: rgb(163,177,198,0.6);
            --sl: rgba(255,255,255,0.5);

            --neu-out:        9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255,0.5);
            --neu-out-lg:     12px 12px 20px rgb(163,177,198,0.7), -12px -12px 20px rgba(255,255,255,0.6);
            --neu-out-sm:     5px 5px 10px rgb(163,177,198,0.6), -5px -5px 10px rgba(255,255,255,0.5);
            --neu-in:         inset 6px 6px 10px rgb(163,177,198,0.6), inset -6px -6px 10px rgba(255,255,255,0.5);
            --neu-in-deep:    inset 10px 10px 20px rgb(163,177,198,0.7), inset -10px -10px 20px rgba(255,255,255,0.6);
            --neu-in-sm:      inset 3px 3px 6px rgb(163,177,198,0.6), inset -3px -3px 6px rgba(255,255,255,0.5);
        }

        /* ── Reset ── */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* ── Base ── */
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── App Shell ── */
        .app {
            width: 100%;
            padding: 20px 28px 60px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 9999px;
            box-shadow: var(--neu-out-sm);
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 44px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.0;
            color: var(--fg);
        }

        header h1 .grad {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-l) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header .sub {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.2px;
        }

        /* ── Control Panel ── */
        .ctrl-panel {
            background: var(--bg);
            border-radius: 24px;
            box-shadow: var(--neu-out);
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* ── Mic ── */
        .mic-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .mic {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            box-shadow: var(--neu-out);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.3s ease-out, transform 0.3s ease-out;
            outline: none;
            position: relative;
        }

        .mic:hover {
            transform: translateY(-2px);
            box-shadow: var(--neu-out-lg);
        }

        .mic:active {
            transform: translateY(1px);
            box-shadow: var(--neu-in-sm);
        }

        .mic:focus-visible {
            outline: 2.5px solid var(--accent);
            outline-offset: 4px;
        }

        .mic svg {
            width: 20px;
            height: 20px;
            color: var(--muted);
            transition: color 0.3s, transform 0.3s;
        }

        .mic.on {
            box-shadow: var(--neu-in);
            transform: none;
            animation: micPulse 1.8s ease-in-out infinite;
        }

        .mic.on:hover {
            transform: none;
            box-shadow: var(--neu-in);
        }

        .mic.on svg {
            color: var(--red);
            transform: scale(1.1);
        }

        @keyframes micPulse {
            0%,100% { box-shadow: var(--neu-in), 0 0 0 0 rgba(239,68,68,0.18); }
            50%      { box-shadow: var(--neu-in), 0 0 0 18px rgba(239,68,68,0); }
        }

        .mic-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .s-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
            transition: background 0.3s;
        }

        body.recording .s-dot {
            background: var(--red);
            animation: blink 0.65s infinite;
        }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

        .s-txt {
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* ── Visualizer Well ── */
        .vis-well {
            flex: 1;
            border-radius: 14px;
            box-shadow: var(--neu-in-deep);
            background: var(--bg);
            height: 48px;
            overflow: hidden;
        }

        #cv {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── Timer ── */
        .timer-zone {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #timer {
            background: var(--bg);
            border-radius: 12px;
            box-shadow: var(--neu-in);
            padding: 7px 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            letter-spacing: 1px;
            transition: color 0.3s;
            min-width: 64px;
            text-align: center;
        }

        body.recording #timer {
            color: var(--red);
        }

        .timer-label {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }

        /* ── Transcript Card ── */
        .transcript {
            background: var(--bg);
            border-radius: 20px;
            box-shadow: var(--neu-in-deep);
            padding: 12px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .transcript-label {
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
        }

        #src {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--fg);
            word-break: break-word;
        }

        #src .ph {
            color: rgba(61,72,82,0.22);
            font-weight: 400;
            font-size: 14px;
        }

        #src .interim {
            color: var(--muted);
        }

        /* ── Trans Status ── */
        #transSt {
            text-align: center;
            margin-bottom: 18px;
            font-size: 13px;
            color: var(--muted);
            min-height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }

        .spinner {
            width: 13px;
            height: 13px;
            border: 2px solid rgba(163,177,198,0.5);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Language Grid ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 44px;
        }

        /* ── Language Card ── */
        .lc {
            background: var(--bg);
            border-radius: 24px;
            box-shadow: var(--neu-out);
            padding: 22px 30px;
            cursor: pointer;
            transition: box-shadow 0.3s ease-out, transform 0.3s ease-out;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 28px;
        }

        .lc:hover {
            transform: translateY(-2px);
            box-shadow: var(--neu-out-lg);
        }

        .lc:active {
            transform: translateY(1px);
            box-shadow: var(--neu-in-sm);
        }

        .lc:focus-visible {
            outline: 2.5px solid var(--accent);
            outline-offset: 3px;
        }

        .lc.speaking {
            box-shadow: var(--neu-in);
            transform: translateY(1px);
        }

        .lc-top {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            width: 160px;
        }

        .lang-pill {
            font-size: 10px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 9999px;
            box-shadow: var(--neu-out-sm);
            white-space: nowrap;
        }

        /* Per-language accent colors */
        .lc:nth-child(1) .lang-pill { color: var(--accent); }
        .lc:nth-child(2) .lang-pill { color: var(--teal); }
        .lc:nth-child(3) .lang-pill { color: #E05B9E; }
        .lc:nth-child(4) .lang-pill { color: var(--amber); }
        .lc:nth-child(5) .lang-pill { color: var(--emerald); }
        .lc:nth-child(6) .lang-pill { color: var(--orange); }

        /* small accent bar — left vertical strip */
        .lc::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            border-radius: 24px 0 0 24px;
            opacity: 0.75;
        }
        .lc:nth-child(1)::before { background: var(--accent); }
        .lc:nth-child(2)::before { background: var(--teal); }
        .lc:nth-child(3)::before { background: #E05B9E; }
        .lc:nth-child(4)::before { background: var(--amber); }
        .lc:nth-child(5)::before { background: var(--emerald); }
        .lc:nth-child(6)::before { background: var(--orange); }

        .vol-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            box-shadow: var(--neu-out-sm);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.25s, box-shadow 0.25s;
        }

        .lc:hover .vol-btn { opacity: 1; }
        .lc.speaking .vol-btn { opacity: 1; }

        .vol-btn svg {
            width: 14px;
            height: 14px;
            color: var(--muted);
        }

        .lc .result {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.3px;
            color: var(--fg);
            word-break: break-word;
        }

        .lc .result .empty {
            color: rgba(61,72,82,0.18);
            font-weight: 500;
            font-size: 20px;
        }

        .lc .result .ld {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(163,177,198,0.5);
            border-top-color: var(--muted);
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            vertical-align: middle;
        }

        /* ── Tech Tags ── */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .tags span {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            padding: 6px 14px;
            border-radius: 9999px;
            box-shadow: var(--neu-out-sm);
            font-weight: 500;
        }

        /* ── No SR ── */
        .nosr {
            background: var(--bg);
            border-radius: 32px;
            box-shadow: var(--neu-out);
            text-align: center;
            padding: 72px 32px;
            margin-bottom: 24px;
        }

        .nosr h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--red);
            margin-bottom: 14px;
        }

        .nosr p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .app { padding: 40px 16px 60px; }

            header h1 { font-size: 44px; letter-spacing: -1.5px; }

            .ctrl-panel {
                flex-wrap: wrap;
                padding: 20px 18px;
                gap: 16px;
            }

            .mic-zone { flex-direction: row; }
            .vis-well { height: 64px; flex-basis: 100%; order: 3; }
            .timer-zone { margin-left: auto; }

            .lc .result { font-size: 20px; }
            .lc-top { width: 100px; }
            .grid { gap: 10px; }
            .transcript { padding: 20px 22px; }
            #src { font-size: 20px; }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header>
            <h1>Voice <span class="grad">Translator</span></h1>
        </header>

        <!-- No SR warning -->
        <div class="nosr" id="nosr" style="display:none">
            <h2>Speech Recognition Not Supported</h2>
            <p>Please open this page in Chrome or Edge to use the microphone.</p>
        </div>

        <div id="main">

            <!-- Control Panel -->
            <div class="ctrl-panel">
                <div class="mic-zone">
                    <button class="mic" id="mic" aria-label="Start recording">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                    <div class="mic-status">
                        <span class="s-dot"></span>
                        <span class="s-txt" id="statusTxt">Click to record</span>
                    </div>
                </div>

                <!-- Waveform -->
                <div class="vis-well">
                    <canvas id="cv"></canvas>
                </div>

                <!-- Timer -->
                <div class="timer-zone">
                    <div id="timer">00:00</div>
                    <div class="timer-label">Duration</div>
                </div>
            </div>

            <!-- Transcript -->
            <div class="transcript">
                <div class="transcript-label">Recognized Speech</div>
                <div id="src"><span class="ph">Start speaking to see transcription…</span></div>
            </div>

            <!-- Translation status -->
            <div id="transSt"></div>

            <!-- Language cards -->
            <div class="grid" id="grid"></div>

            <!-- Tech tags -->
            <div class="tags">
                <span>SpeechRecognition</span>
                <span>SpeechSynthesis</span>
                <span>Web Audio API</span>
                <span>Canvas</span>
                <span>MyMemory API</span>
            </div>

        </div>
    </div>

    <script>
        const LANGS = [
            { code: 'zh', name: '中文',      voice: 'zh-CN', pair: 'en|zh' },
            { code: 'ja', name: '日本語',    voice: 'ja-JP', pair: 'en|ja' },
            { code: 'ko', name: '한국어',    voice: 'ko-KR', pair: 'en|ko' },
            { code: 'fr', name: 'Français',  voice: 'fr-FR', pair: 'en|fr' },
            { code: 'de', name: 'Deutsch',   voice: 'de-DE', pair: 'en|de' },
            { code: 'es', name: 'Español',   voice: 'es-ES', pair: 'en|es' },
        ];

        const $mic      = document.getElementById('mic');
        const $statusTxt= document.getElementById('statusTxt');
        const $timer    = document.getElementById('timer');
        const $transSt  = document.getElementById('transSt');
        const $grid     = document.getElementById('grid');
        const $src      = document.getElementById('src');

        // ── Build language cards ──────────────────────────────────────────────
        LANGS.forEach(l => {
            const d = document.createElement('div');
            d.className = 'lc';
            d.id = `lc-${l.code}`;
            d.setAttribute('tabindex', '0');
            d.setAttribute('role', 'button');
            d.setAttribute('aria-label', `Listen to ${l.name} translation`);
            d.innerHTML = `
                <div class="lc-top">
                    <span class="lang-pill">${l.name}</span>
                </div>
                <div class="result" id="r-${l.code}"><span class="empty">—</span></div>
                <span class="vol-btn" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </span>`;
            d.addEventListener('click', () => speak(l));
            d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); speak(l); } });
            $grid.appendChild(d);
        });

        // ── SpeechRecognition ─────────────────────────────────────────────────
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            document.getElementById('nosr').style.display = 'block';
            document.getElementById('main').style.display = 'none';
        }

        let recog, listening = false;
        let fullText = '', interimText = '';
        let seconds = 0, timerInt, transInt;
        let lastTranslated = '';

        function renderSrc() {
            if (!fullText && !interimText) {
                $src.innerHTML = '<span class="ph">Start speaking to see transcription…</span>';
            } else {
                const safe = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                $src.innerHTML =
                    (fullText ? safe(fullText) : '') +
                    (interimText ? `<span class="interim">${safe(interimText)}</span>` : '');
            }
        }

        if (SR) {
            recog = new SR();
            recog.lang = 'en-US';
            recog.continuous = true;
            recog.interimResults = true;

            recog.onresult = e => {
                let newFinal = '';
                interimText = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) newFinal += t;
                    else interimText += t;
                }
                if (newFinal) fullText += newFinal;
                renderSrc();
            };

            recog.onerror = e => {
                if (e.error === 'not-allowed') $statusTxt.textContent = 'Microphone access denied';
                stopRec(false);
            };

            recog.onend = () => { if (listening) try { recog.start(); } catch (e) { } };
        }

        $mic.addEventListener('click', () => { if (listening) stopRec(true); else startRec(); });

        function startRec() {
            if (!recog) return;
            fullText = ''; interimText = ''; seconds = 0; lastTranslated = '';
            $timer.textContent = '00:00';
            $transSt.innerHTML = '';
            renderSrc();
            LANGS.forEach(l => {
                document.getElementById(`r-${l.code}`).innerHTML = '<span class="empty">—</span>';
                document.getElementById(`lc-${l.code}`).classList.remove('speaking');
            });
            recog.start();
            listening = true;
            document.body.classList.add('recording');
            $mic.classList.add('on');
            $mic.setAttribute('aria-label', 'Stop recording');
            $statusTxt.textContent = 'Recording';
            timerInt = setInterval(() => {
                seconds++;
                $timer.textContent =
                    String(Math.floor(seconds / 60)).padStart(2, '0') + ':' +
                    String(seconds % 60).padStart(2, '0');
            }, 1000);
            transInt = setInterval(() => {
                const current = (fullText + interimText).trim();
                if (current && current !== lastTranslated) {
                    lastTranslated = current;
                    translateAll(current);
                }
            }, 3000);
            startVis();
        }

        function stopRec(doTrans) {
            listening = false;
            try { recog.stop(); } catch (e) { }
            document.body.classList.remove('recording');
            $mic.classList.remove('on');
            $mic.setAttribute('aria-label', 'Start recording');
            $statusTxt.textContent = 'Click to record';
            clearInterval(timerInt);
            clearInterval(transInt);
            stopVis();
            if (interimText) { fullText += interimText; interimText = ''; renderSrc(); }
            const finalText = fullText.trim();
            if (doTrans && finalText && finalText !== lastTranslated) {
                lastTranslated = finalText;
                translateAll(finalText);
            }
        }

        // ── Translation ───────────────────────────────────────────────────────
        async function translateAll(text) {
            const total = LANGS.length;
            let done = 0;
            $transSt.innerHTML = `<span class="spinner"></span> Translating into ${total} languages…`;
            LANGS.forEach(l => {
                document.getElementById(`r-${l.code}`).innerHTML = '<span class="ld"></span>';
            });

            const promises = LANGS.map(async lang => {
                try {
                    const q = text.length > 500 ? text.slice(0, 500) : text;
                    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${lang.pair}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    document.getElementById(`r-${lang.code}`).textContent =
                        data.responseData?.translatedText || 'Translation failed';
                } catch {
                    document.getElementById(`r-${lang.code}`).textContent = 'Network error';
                }
                done++;
                $transSt.innerHTML = `<span class="spinner"></span> ${done} / ${total} complete`;
            });

            await Promise.all(promises);
            $transSt.innerHTML = '✓ Done · Click any card to listen';
            setTimeout(() => { $transSt.innerHTML = ''; }, 4000);
        }

        // ── Speech Synthesis ──────────────────────────────────────────────────
        function speak(lang) {
            const text = document.getElementById(`r-${lang.code}`).textContent;
            if (!text || text === '—' || text === 'Network error' || text === 'Translation failed') return;
            speechSynthesis.cancel();
            LANGS.forEach(l => document.getElementById(`lc-${l.code}`).classList.remove('speaking'));
            const card = document.getElementById(`lc-${lang.code}`);
            card.classList.add('speaking');
            const utt = new SpeechSynthesisUtterance(text);
            utt.lang = lang.voice;
            utt.rate = 0.92;
            const voices = speechSynthesis.getVoices();
            const match = voices.find(v => v.lang.startsWith(lang.voice.split('-')[0]));
            if (match) utt.voice = match;
            utt.onend = () => card.classList.remove('speaking');
            utt.onerror = () => card.classList.remove('speaking');
            speechSynthesis.speak(utt);
        }

        if (window.speechSynthesis) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }

        // ── Audio Visualizer ──────────────────────────────────────────────────
        const canvas = document.getElementById('cv');
        const cx = canvas.getContext('2d');
        let audioCtx, analyser, dataArr, micSrc, raf;

        function fit() {
            const dpr = devicePixelRatio || 1;
            const r = canvas.parentElement.getBoundingClientRect();
            canvas.width = r.width * dpr;
            canvas.height = r.height * dpr;
            cx.scale(dpr, dpr);
            canvas.style.width  = r.width  + 'px';
            canvas.style.height = r.height + 'px';
        }
        fit();
        addEventListener('resize', fit);

        // Idle: soft animated bars using accent purple
        function idleDraw() {
            const w = canvas.width / (devicePixelRatio || 1);
            const h = canvas.height / (devicePixelRatio || 1);
            cx.clearRect(0, 0, w, h);
            const t = Date.now() / 1400, n = 64, gap = w / n;
            for (let i = 0; i < n; i++) {
                const x = i * gap + gap / 2;
                const wave = Math.sin(t + i * 0.14) + Math.sin(t * 0.6 + i * 0.09);
                const a = wave * 2.5 + 3.5;
                const alpha = 0.10 + Math.abs(Math.sin(t * 0.4 + i * 0.07)) * 0.08;
                cx.fillStyle = `rgba(108,99,255,${alpha})`;
                cx.fillRect(x - 1.2, h / 2 - a, 2, a * 2);
            }
            raf = requestAnimationFrame(idleDraw);
        }
        idleDraw();

        // Live: frequency spectrum with design-system color gradient
        const PAL = [
            [108,  99, 255],  // accent purple
            [ 56, 178, 172],  // teal
            [245, 158,  11],  // amber
            [236,  72, 153],  // pink
            [ 16, 185, 129],  // emerald
        ];

        async function startVis() {
            try {
                if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micSrc = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.75;
                micSrc.connect(analyser);
                dataArr = new Uint8Array(analyser.frequencyBinCount);
                cancelAnimationFrame(raf);
                liveDraw();
            } catch (e) { console.error(e); }
        }

        function liveDraw() {
            if (!listening) return;
            const w = canvas.width / (devicePixelRatio || 1);
            const h = canvas.height / (devicePixelRatio || 1);
            cx.clearRect(0, 0, w, h);
            analyser.getByteFrequencyData(dataArr);
            const len = dataArr.length, bw = w / len;
            for (let i = 0; i < len; i++) {
                const v  = dataArr[i] / 255;
                const bh = v * h * 0.86;
                const x  = i * bw;
                const ci   = (i / len) * (PAL.length - 1);
                const idx  = Math.floor(ci), frac = ci - idx;
                const c1   = PAL[Math.min(idx, PAL.length - 1)];
                const c2   = PAL[Math.min(idx + 1, PAL.length - 1)];
                const r = (c1[0] + (c2[0] - c1[0]) * frac) | 0;
                const g = (c1[1] + (c2[1] - c1[1]) * frac) | 0;
                const b = (c1[2] + (c2[2] - c1[2]) * frac) | 0;
                const grd = cx.createLinearGradient(0, h / 2 - bh / 2, 0, h / 2 + bh / 2);
                grd.addColorStop(0,    `rgba(${r},${g},${b},0.05)`);
                grd.addColorStop(0.25, `rgba(${r},${g},${b},0.50)`);
                grd.addColorStop(0.5,  `rgba(${r},${g},${b},0.80)`);
                grd.addColorStop(0.75, `rgba(${r},${g},${b},0.50)`);
                grd.addColorStop(1,    `rgba(${r},${g},${b},0.05)`);
                cx.fillStyle = grd;
                cx.fillRect(x, h / 2 - bh / 2, Math.max(bw - 0.8, 1), bh);
            }
            raf = requestAnimationFrame(liveDraw);
        }

        function stopVis() {
            cancelAnimationFrame(raf);
            if (micSrc) {
                micSrc.mediaStream.getTracks().forEach(t => t.stop());
                micSrc.disconnect();
                micSrc = null;
            }
            idleDraw();
        }
    </script>

</body>
</html>
